<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NexoraAI.com — Redirecting</title>
    <style>html,body{background:#07080A;color:#F4F2ED;margin:0;font-family:sans-serif;}</style>
    <script>
      (function () {
        var loc = window.location;
        var path = loc.pathname || '/';
        var knownRoutes = ['pricing', 'cloud', 'download', 'account', 'admin', 'guide', 'remote', 'security', 'terms', 'refund', 'privacy'];
        var parts = path.split('/').filter(Boolean);
        var isGh = loc.hostname.endsWith('.github.io');
        if (isGh && parts.length > 0 && knownRoutes.indexOf(parts[0]) === -1) {
          var base = '/' + parts[0] + '/';
          var subRoute = parts.length > 1 ? '/' + parts.slice(1).join('/') : '/';
          loc.replace(loc.origin + base + '#' + subRoute + loc.search);
        } else {
          loc.replace(loc.origin + '/#' + path + loc.search);
        }
      })();
    </script>
  </head>
  <body></body>
</html>
